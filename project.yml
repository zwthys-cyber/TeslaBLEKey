name: TeslaBLEKey
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  TeslaBLEKeyKit:
    url: https://github.com/zwthys-cyber/TeslaBLEKeyKit.git
    revision: d5da62c003ac6e2e0d8695f910957dd5708c82d7
  NeteaseCloudMusicAPI:
    url: https://github.com/Lincb522/NeteaseCloudMusicApi-Swift.git
    revision: 8626b8fe628144e051dd9e07180850d253c808f2
targets:
  TeslaBLEKey:
    type: application
    platform: iOS
    sources: [TeslaBLEKey]
    info:
      path: TeslaBLEKey/Info.plist
      properties:
        CFBundleDisplayName: 小特
        CFBundleName: 小特
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 用于在本地连接您的 Tesla 并执行钥匙操作。
        NSFaceIDUsageDescription: 用于按您选择的保护级别确认车辆控制操作。
        NSCameraUsageDescription: 用于识别车机屏幕或车门铭牌上的 VIN。
        UIBackgroundModes: [bluetooth-central]
        CFBundleURLTypes:
          - CFBundleURLName: com.local.teslablekey.oauth
            CFBundleURLSchemes: [teslablekey]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.teslablekey
        PRODUCT_NAME: TeslaBLEKey
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 302
        MARKETING_VERSION: 3.0.2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TeslaBLEKeyKit
        product: TeslaBLEKeyKit
      - package: NeteaseCloudMusicAPI
        product: NeteaseCloudMusicAPI
      - target: TeslaBLEKeyWatch
        embed: true
  TeslaBLEKeyWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    info:
      path: TeslaBLEKeyWatch/WatchAppInfo.plist
      properties:
        CFBundleDisplayName: 小特钥匙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKWatchKitApp: true
        WKCompanionAppBundleIdentifier: com.local.teslablekey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.teslablekey.watchkitapp
        PRODUCT_NAME: TeslaBLEKeyWatch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 302
        MARKETING_VERSION: 3.0.2
    dependencies:
      - target: TeslaBLEKeyWatchExtension
  TeslaBLEKeyWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [TeslaBLEKeyWatch]
    info:
      path: TeslaBLEKeyWatch/ExtensionInfo.plist
      properties:
        CFBundleDisplayName: 小特钥匙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.local.teslablekey.watchkitapp
          NSExtensionPointIdentifier: com.apple.watchkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.teslablekey.watchkitapp.watchkitextension
        PRODUCT_NAME: TeslaBLEKeyWatchExtension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 302
        MARKETING_VERSION: 3.0.2
  TeslaBLEKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TeslaBLEKeyTests]
    dependencies:
      - target: TeslaBLEKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TeslaBLEKey:
    build:
      targets:
        TeslaBLEKey: all
        TeslaBLEKeyTests: [test]
    test:
      targets:
        - TeslaBLEKeyTests
