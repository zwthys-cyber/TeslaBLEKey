name: TeslaBLEKey
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
packages:
  TeslaBLE:
    url: https://github.com/shoujiaxin/swift-tesla-ble.git
    revision: a407b05bd93de70f91cd6318fb8a2320a063d101
targets:
  TeslaBLEKey:
    type: application
    platform: iOS
    sources: [TeslaBLEKey]
    info:
      path: TeslaBLEKey/Info.plist
      properties:
        CFBundleDisplayName: Tesla BLE Key
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 用于在本地连接您的 Tesla 并执行钥匙操作。
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.teslablekey
        PRODUCT_NAME: TeslaBLEKey
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    dependencies:
      - package: TeslaBLE
        product: TeslaBLE
  TeslaBLEKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TeslaBLEKeyTests]
    dependencies:
      - target: TeslaBLEKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TeslaBLEKey:
    build:
      targets:
        TeslaBLEKey: all
        TeslaBLEKeyTests: [test]
    test:
      targets:
        - TeslaBLEKeyTests

