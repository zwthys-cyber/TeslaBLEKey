name: TeslaBLEKey
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
packages:
  TeslaBLEKeyKit:
    url: https://github.com/misakatao/TeslaBLEKeyKit.git
    revision: e186c5a2ade352b719cb53b92599619f2556b841
targets:
  TeslaBLEKey:
    type: application
    platform: iOS
    sources: [TeslaBLEKey]
    info:
      path: TeslaBLEKey/Info.plist
      properties:
        CFBundleDisplayName: 小特蓝牙钥匙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 用于在本地连接您的 Tesla 并执行钥匙操作。
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.teslablekey
        PRODUCT_NAME: TeslaBLEKey
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.4.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TeslaBLEKeyKit
        product: TeslaBLEKeyKit
  TeslaBLEKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TeslaBLEKeyTests]
    dependencies:
      - target: TeslaBLEKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TeslaBLEKey:
    build:
      targets:
        TeslaBLEKey: all
        TeslaBLEKeyTests: [test]
    test:
      targets:
        - TeslaBLEKeyTests
