name: Build iOS 17 IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-library:
    name: Tesla protocol tests
    runs-on: macos-26
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout pinned TeslaBLEKeyKit library
        uses: actions/checkout@v5
        with:
          repository: misakatao/TeslaBLEKeyKit
          ref: e186c5a2ade352b719cb53b92599619f2556b841
          path: .ci/TeslaBLEKeyKit

      - name: Run protocol and crypto tests
        working-directory: .ci/TeslaBLEKeyKit
        run: swift test

  build-app:
    name: Build unsigned TrollStore IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project TeslaBLEKey.xcodeproj -scheme TeslaBLEKey

      - name: Build for physical iPhone without signing
        run: |
          xcodebuild \
            -project TeslaBLEKey.xcodeproj \
            -scheme TeslaBLEKey \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package TrollStore IPA
        run: |
          mkdir -p build/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/TeslaBLEKey.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/TeslaBLEKey-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: TeslaBLEKey-iOS17-TrollStore
          path: build/TeslaBLEKey-unsigned.ipa
          if-no-files-found: error
