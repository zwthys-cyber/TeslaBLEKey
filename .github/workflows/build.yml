name: Build and verify on Xiaote Mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaote-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Fleet API backend tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xiaote-mac]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

  test-library:
    name: Tesla protocol tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xiaote-mac]
    timeout-minutes: 30
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Checkout pinned app TeslaBLEKeyKit fork
        uses: actions/checkout@v6
        with:
          repository: zwthys-cyber/TeslaBLEKeyKit
          ref: d5da62c003ac6e2e0d8695f910957dd5708c82d7
          path: .ci/TeslaBLEKeyKit

      - name: Run protocol and crypto tests
        working-directory: .ci/TeslaBLEKeyKit
        run: swift test

  build-app:
    name: Build unsigned TrollStore IPA
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xiaote-mac]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify local Mac toolchain
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Xiaote.xcodeproj -scheme Xiaote

      - name: Run app protocol regression tests
        run: |
          xcodebuild test \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for physical iPhone without signing
        run: |
          xcodebuild \
            -project Xiaote.xcodeproj \
            -scheme Xiaote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package TrollStore IPA
        run: |
          mkdir -p build/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Xiaote.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/Xiaote-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Xiaote-iOS17-TrollStore
          path: build/Xiaote-unsigned.ipa
          if-no-files-found: error
